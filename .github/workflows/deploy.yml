name: Despliegue EPL App a Vultr

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargando codigo
        uses: actions/checkout@v4

      - name: Desplegando en servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: adminepl
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "."
          target: "/home/adminepl/htdocs/padel.207.246.68.77.nip.io"
          rm: false

      - name: Configurando entorno en servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: adminepl
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            TARGET="/home/adminepl/htdocs/padel.207.246.68.77.nip.io"
            if [ -d "$TARGET/home" ]; then
              cp -r "$TARGET/home/adminepl/htdocs/padel.207.246.68.77.nip.io/." "$TARGET/"
              rm -rf "$TARGET/home"
              echo "Corregida estructura de directorio"
            fi
            if [ -f "$TARGET/.env.prod" ]; then
              mv "$TARGET/.env.prod" "$TARGET/.env"
              echo ".env configurado"
            fi
            echo "Deploy completado: $(date)"
            ls "$TARGET" | head -20
